# Standalone app with PostgreSQL and the existing Keycloak transition service.
# Keep legacy deployments accessible until all accounts have local credentials.
#
# Coolify magic variables must not contain "-": Compose reads
# SERVICE_PASSWORD_KEYCLOAK-DB as "SERVICE_PASSWORD_KEYCLOAK, default DB".
# Existing Keycloak database volumes keep the credentials they were created
# with; set KEYCLOAK_DB_USER/KEYCLOAK_DB_PASSWORD to those values (see README).

services:
  urlaubsplaner:
    build: .
    expose:
      - "3000"
    environment:
      - NEXTAUTH_URL=${SERVICE_URL_URLAUBSPLANER}
      - NEXTAUTH_SECRET=${SERVICE_BASE64_URLAUBSPLANER}
      - AUTH_KEYCLOAK_ID=${AUTH_KEYCLOAK_ID:-urlaubsplaner}
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET:-${SERVICE_PASSWORD_KEYCLOAKCLIENT}}
      - AUTH_KEYCLOAK_ISSUER=${AUTH_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-urlaubsplaner}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-urlaubsplaner.me}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-urlaubsplaner}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Use node-based check against /api/health (no DB / Keycloak / auth deps).
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-urlaubsplaner}
    volumes:
      - urlaubsplaner-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$${POSTGRES_USER}", "-d", "$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-${SERVICE_USER_KEYCLOAKDB}}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-${SERVICE_PASSWORD_KEYCLOAKDB}}
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${SERVICE_PASSWORD_KEYCLOAKADMIN}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-${SERVICE_USER_KEYCLOAKDB}}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-${SERVICE_PASSWORD_KEYCLOAKDB}}
      - POSTGRES_DB=${KEYCLOAK_DB:-keycloak}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$${POSTGRES_USER}", "-d", "$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  urlaubsplaner-db:
  keycloak-db:
